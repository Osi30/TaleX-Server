services:
  app:
    build: .
    ports:
      - "8080:8080"
    # VPS nâng cấp lên 8GB RAM / 6 core (từ 5.8GB / 4 core) chia cho nhiều service (BE+
    # Postgres+QuestDB, AI+Milvus) — không giới hạn thì JVM có thể phình không kiểm soát
    # dưới tải cao, cạn RAM cả máy chủ và kéo sập container khác. Đặt trần để nếu vượt, chỉ
    # container này bị Docker tự kill + restart. Giữ nguyên 1.5g vì RAM không phải điểm
    # tranh chấp chính trong đợt tái cân bằng này (chỉ CPU được phân bổ lại).
    mem_limit: 1.5g
    # Giảm từ 1.5 xuống 1.0 core — phần CPU dư ra được ưu tiên cho AI-Python xử lý watermark
    # (xem docker-compose.yml bên repo AI-Python). BE vẫn được giữ ở mức đủ dùng (không giảm
    # về mức thấp hơn từng cân nhắc, vd. 0.6) vì BE phục vụ trực tiếp traffic HTTP của người
    # dùng thật — khác AI-Python watermark vốn chạy nền/bất đồng bộ qua Kafka, không chặn
    # trải nghiệm user ngay lập tức.
    cpus: 1.0
    env_file: .env
    environment:
      # JVM mặc định chạy UTC nếu không set — mọi @CreationTimestamp LocalDateTime (Media,
      # ContentCensorship...) ghi giờ UTC nhưng serialize JSON không kèm offset, FE hiểu
      # nhầm là giờ local trình duyệt, hiển thị lệch 7 tiếng cho admin ở VN. Local dev
      # (docker-compose.yml) đã có sẵn dòng này — prod trước đây bị thiếu.
      - TZ=Asia/Ho_Chi_Minh
      # Override DB to use local PostgreSQL container
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=talex-db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-12345}
      - DB_OPTIONS=
      - SPRING_PROFILES_ACTIVE=prod
      # Trước đây deploy.yml tự chèn 3 dòng này vào file này BẰNG sed trên VPS mỗi lần
      # deploy (không commit lại) — bất kỳ lúc nào docker-compose.prod.yml đổi ở git, VPS
      # có diff cục bộ khiến git pull XUNG ĐỘT và deploy.yml (sau khi thêm set -e) fail
      # ngay đầu, không deploy được gì cả (đã xảy ra thật 2 lần). Đưa thẳng vào git để
      # không còn cần tự sửa file trên VPS nữa — pass qua từ export ở deploy.yml.
      - KAFKA_ACCESS_CERTB64
      - KAFKA_CA_CERTB64
      - KAFKA_ACCESS_KEYB64
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=8812
      - QUESTDB_ILP_PORT=9009
    depends_on:
      db:
        condition: service_healthy
      questdb:
        condition: service_started
    restart: always

  db:
    image: postgres:16
    ports:
      - "0.0.0.0:5432:5432"
    # Trước đây KHÔNG giới hạn, dựa vào phần dư của các container khác — trên VPS 6 core/
    # 8GB mới, đặt trần rõ ràng để Postgres không thể chiếm hết CPU/RAM còn lại. Trần mỏng
    # theo chủ đích (ưu tiên AI-Python watermark) — áp dụng đòi hỏi restart container này
    # (gián đoạn DB ngắn), nên deploy vào giờ ít người dùng.
    mem_limit: 600m
    cpus: 0.15
    environment:
      - POSTGRES_DB=talex-db
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12345}
    command: postgres -c wal_level=logical -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /root/talex-pg-ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - /root/talex-pg-ssl/server.key:/var/lib/postgresql/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  questdb:
    image: questdb/questdb:8.2.3
    ports:
      - "8812:8812"
      - "9000:9000"
      - "127.0.0.1:9009:9009"
    # Trước đây KHÔNG giới hạn — xem ghi chú tương tự ở service `db` phía trên. QuestDB chỉ
    # dùng để ghi interaction log qua ILP, tải nhẹ nên trần thấp nhất trong 5 service.
    # Nâng 400m -> 768m: baseline thực đo ~229MB (57% của 400m) không còn margin cho lúc
    # nhiều Kafka worker (Like/View/Watch/Comment/Share/Bookmark) + scheduler (Trending,
    # MongoFeatureSync) + query recommend cùng dồn vào HikariPool-2 một lúc — bị cgroup
    # throttle mạnh, gây "Connect timed out" hàng loạt kéo theo app đơ toàn bộ (đã xảy ra
    # thật, không phải suy đoán).
    mem_limit: 768m
    cpus: 0.1
    environment:
      - QDB_PG_USER=${QUESTDB_USER:-admin}
      - QDB_PG_PASSWORD=${QUESTDB_PASSWORD:-quest}
    volumes:
      - questdb-data:/var/lib/questdb
    restart: always

volumes:
  pgdata:
  questdb-data:
